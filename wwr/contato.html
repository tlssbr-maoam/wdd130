<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Splash Rafting em Corredeiras</title>
    <meta name="description"
      content="Entre em contato com a Splash Rafting em Corredeiras para dúvidas, reservas ou sugestões.">
    <meta name="author" content="Tiago Lopes Silva e Silva">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/logotipo.png" alt="Logotipo do Site de Rafting">

        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contato">

            <h1>Splash Rafting em Corredeiras</h1>

            <p class="informacoes">
                123 Rua Principal do Rio<br>
                Foz do Iguaçu, Paraná<br>
                +55 45 99999-9999<br>
                info@corredeiras.com
            </p>

            <div class="contato-conteudo">

                <div class="mapa">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d38235.46120871731!2d-54.58502531072825!3d-25.55902268902327!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1790904685505!5m2!1spt-BR!2sbr"
                      width="600" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>

                </div>

                <form>

                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite aqui" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>

                    <fieldset>
                        <legend>Propósito da Mensagem</legend>

                        <label>
                            <input type="radio" id="duvidao" name="proposito" value="duvida"
                              checked>
                            Dúvida Geral
                        </label>

                        <label>
                            <input type="radio" id="reserva" name="proposito" value="reserva">
                            Pergunta sobre Reserva
                        </label>

                        <label>
                            <input type="radio" id="sugestao" name="proposito" value="sugestao">
                            Sugestão
                        </label>
                    </fieldset>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Digite aqui"
                      required></textarea>

                    <label class="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Por favor, me inscreva na Newsletter mensal
                    </label>

                    <button type="submit">Entrar em Contato!</button>

                </form>

            </div>

        </section>

        <section class="funcionarios">

            <h2>Estamos Aqui para Serví-lo</h2>

            <div class="equipe">

                <figure>
                    <img src="imagens/funcionario1.jpg" alt="Perfil do funcionário">
                    <figcaption>Maria Souza<br>Guia de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/funcionario2.jpg" alt="Perfil do funcionário">
                    <figcaption>José Carlos<br>Atendimento</figcaption>
                </figure>

                <figure>
                    <img src="imagens/funcionario3.jpg" alt="Perfil do funcionário">
                    <figcaption>Pedro Brandão<br>Instrutor de Rafting</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>©️2026 🚣 Splash Rafting em Corredeiras 🚣 Tiago Lopes Silva e Silva.</p>

        <nav class="redes-sociais">
            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="Ícone do Instagram">
            </a>

            <a href="https://youtube.com">
                <img src="imagens/youtube.svg" alt="Ícone do Youtube">
            </a>

            <a href="https://linkedin.com">
                <img src="imagens/linkedin.svg" alt="Ícone do LinkedIn">
            </a>
        </nav>

    </footer>

</body>

</html>
